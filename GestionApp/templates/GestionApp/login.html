<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Biblioteca App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center h-screen">
    <div class="w-full max-w-md bg-white p-8 rounded-lg shadow-xl">
        <h2 class="text-2xl font-bold mb-6 text-center text-slate-700">Iniciar Sesión</h2>
        <form method="post">
            {% csrf_token %}
            
            {% if form.non_field_errors %}
                <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
                    {% for error in form.non_field_errors %}
                        <span class="block sm:inline">{{ error }}</span>
                    {% endfor %}
                </div>
            {% endif %}

            <div class="mb-4">
                <label for="{{ form.nombre_usuario.id_for_label }}" class="block text-sm font-medium text-gray-700">{{ form.nombre_usuario.label }}</label>
                {{ form.nombre_usuario }}
            </div>
            <div class="mb-6">
                <label for="{{ form.clave.id_for_label }}" class="block text-sm font-medium text-gray-700">{{ form.clave.label }}</label>
                {{ form.clave }}
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-md">
                Acceder
            </button>
        </form>
    </div>
</body>
</html>
