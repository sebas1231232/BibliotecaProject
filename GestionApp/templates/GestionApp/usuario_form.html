<form id="usuario-form" method="post" action="{% if instance %}{% url 'usuario_editar' id=instance.id_usuario %}{% else %}{% url 'usuario_crear' %}{% endif %}" novalidate>
    {% csrf_token %}
    <h2 class="text-3xl font-bold text-slate-700 mb-6">
        {% if instance %}Editar Usuario{% else %}Añadir Nuevo Usuario{% endif %}
    </h2>
    <div class="space-y-4">
        {% for field in form %}
            <div>
                <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700">{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}
                    <p class="mt-1 text-xs text-red-500">{{ error }}</p>
                {% endfor %}
            </div>
        {% endfor %}
    </div>
    <div class="mt-6 border-t pt-4 flex items-center justify-end gap-x-4">
        <button type="button" id="cancel-modal-button" class="text-sm font-semibold leading-6 text-gray-900">Cancelar</button>
        <button type="submit" class="rounded-md bg-blue-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-500">
            {% if instance %}Actualizar Usuario{% else %}Guardar Usuario{% endif %}
        </button>
    </div>
</form>
