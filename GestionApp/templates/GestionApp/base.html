<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca App - {% block title %}{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <style>
        body { font-family: 'Inter', sans-serif; }
        .nav-button.active { background-color: #3b82f6; color: white; }
        .nav-button:hover:not(.active) { background-color: #4b5563; }
        .modal-overlay { position: fixed; z-index: 50; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body class="bg-slate-100">
    <div class="flex">
        <aside class="w-64 bg-slate-800 text-white min-h-screen p-4 flex flex-col">
            <div>
                <h1 class="text-2xl font-bold mb-10 text-center">Biblioteca App</h1>
                <nav>
                    <a href="{% url 'inicio' %}" class="nav-button block py-2.5 px-4 rounded {% if request.resolver_match.url_name == 'inicio' %}active{% endif %}"><i class="fas fa-home fa-fw mr-2"></i>Inicio</a>
                    <a href="{% url 'lista_libros' %}" class="nav-button block py-2.5 px-4 rounded {% if request.resolver_match.url_name == 'lista_libros' %}active{% endif %}"><i class="fas fa-book fa-fw mr-2"></i>Libros</a>
                    <a href="{% url 'lista_usuarios' %}" class="nav-button block py-2.5 px-4 rounded {% if request.resolver_match.url_name == 'lista_usuarios' %}active{% endif %}"><i class="fas fa-users fa-fw mr-2"></i>Usuarios</a>
                    <a href="{% url 'lista_prestamos' %}" class="nav-button block py-2.5 px-4 rounded {% if request.resolver_match.url_name == 'lista_prestamos' %}active{% endif %}"><i class="fas fa-handshake fa-fw mr-2"></i>Préstamos</a>
                    <a href="{% url 'lista_multas' %}" class="nav-button block py-2.5 px-4 rounded {% if request.resolver_match.url_name == 'lista_multas' %}active{% endif %}"><i class="fas fa-file-invoice-dollar fa-fw mr-2"></i>Multas</a>
                    <a href="{% url 'reportes' %}" class="nav-button block py-2.5 px-4 rounded {% if request.resolver_match.url_name == 'reportes' %}active{% endif %}"><i class="fas fa-chart-line fa-fw mr-2"></i>Reportes</a>
                </nav>
            </div>
            <div class="mt-auto">
                {% if request.session.login_usuario_nombre %}
                <div class="px-4 py-2 text-sm text-slate-400 border-t border-slate-700">
                    <p>Usuario:</p><p class="font-semibold">{{ request.session.login_usuario_nombre }}</p>
                </div>
                {% endif %}
                <a href="/admin/" target="_blank" class="nav-button block w-full text-left py-2.5 px-4 rounded mt-2 hover:bg-slate-700"><i class="fas fa-cogs fa-fw mr-2"></i>Admin Panel</a>
                <a href="{% url 'logout' %}" class="nav-button block w-full text-left py-2.5 px-4 rounded hover:bg-red-700 mt-2"><i class="fas fa-sign-out-alt fa-fw mr-2"></i>Cerrar Sesión</a>
            </div>
        </aside>
        <main class="flex-1 p-10">
            <div id="seleccion-prestamo-container" class="bg-blue-600 text-white p-4 rounded-lg shadow-lg mb-6 items-center justify-between" style="display: none;"></div>
            {% block content %}{% endblock %}
        </main>
    </div>
    <div id="genericModal" class="modal-overlay" style="display: none;">
        <div id="genericModalContent" class="modal-content bg-white p-8 rounded-lg shadow-xl w-full max-w-2xl relative"></div>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script>
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        const csrftoken = getCookie('csrftoken');

        window.getSeleccion = function() {
            const seleccion = sessionStorage.getItem('seleccionDePrestamo');
            return seleccion ? JSON.parse(seleccion) : [];
        }
        window.saveSeleccion = function(seleccion) {
            sessionStorage.setItem('seleccionDePrestamo', JSON.stringify(seleccion));
            window.actualizarSeleccionVisual();
        }
        window.actualizarSeleccionVisual = function() {
            const seleccionContainer = document.getElementById('seleccion-prestamo-container');
            const seleccion = window.getSeleccion();
            if (seleccion.length > 0 && seleccionContainer) {
                seleccionContainer.innerHTML = `
                        <div class="flex items-center justify-between w-full">
                            <div>
                                <span class="font-bold text-lg">Selección de Préstamo:</span>
                                <span class="ml-2 font-mono bg-blue-800 px-2 py-1 rounded-full text-sm">${seleccion.length}</span> libro(s) seleccionado(s).
                            </div>
                            <a href="{% url 'lista_prestamos' %}" class="bg-white text-blue-700 font-bold py-2 px-4 rounded hover:bg-blue-100">
                                Proceder al Préstamo <i class="fas fa-arrow-right ml-2"></i>
                            </a>
                        </div>`;
                seleccionContainer.style.display = 'flex';
            } else if (seleccionContainer) {
                seleccionContainer.style.display = 'none';
            }
        }

        async function addNewOptionViaAjax(url, selectElement, itemName) {
            const name = prompt(`Ingrese el nombre para la nueva ${itemName}:`);
            if (!name) return;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({ nombre: name })
                });
                const data = await response.json();
                if (data.success) {
                    const newOption = new Option(data.nombre, data.id, true, true);
                    selectElement.append(newOption).trigger('change');
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (err) {
                alert(`Error de conexión al crear ${itemName}.`);
            }
        }

        window.openFormModal = async function(url, formId, callbackSubmit) {
            const modal = document.getElementById('genericModal');
            const modalContent = document.getElementById('genericModalContent');
            modalContent.innerHTML = '<p class="text-center">Cargando...</p>';
            modal.style.display = 'flex';
            try {
                const response = await fetch(url);
                modalContent.innerHTML = await response.text();

                if ($.fn.select2) {
                    $('#id_categoria, #id_editorial').select2({
                        width: '100%',
                        dropdownParent: $('#genericModalContent')
                    });
                }
                
                const form = document.getElementById(formId);
                if (form) form.addEventListener('submit', callbackSubmit);
                
                const cancelBtn = document.getElementById('cancel-modal-button');
                if(cancelBtn) cancelBtn.addEventListener('click', () => { modal.style.display = 'none'; });

                const addCategoryBtn = document.getElementById('add-category-btn');
                const addEditorialBtn = document.getElementById('add-editorial-btn');
                
                if (addCategoryBtn) {
                    addCategoryBtn.addEventListener('click', () => {
                        addNewOptionViaAjax("{% url 'categoria_crear_ajax' %}", $('#id_categoria'), 'categoría');
                    });
                }

                if (addEditorialBtn) {
                    addEditorialBtn.addEventListener('click', () => {
                        addNewOptionViaAjax("{% url 'editorial_crear_ajax' %}", $('#id_editorial'), 'editorial');
                    });
                }

            } catch (err) {
                modalContent.innerHTML = '<p>Error al cargar el formulario.</p>';
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => window.actualizarSeleccionVisual());

        window.addEventListener('click', (event) => {
            const modal = document.getElementById('genericModal');
            if (event.target == modal) {
                modal.style.display = "none";
            }
        });
    </script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
